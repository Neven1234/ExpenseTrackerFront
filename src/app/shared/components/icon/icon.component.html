<svg
  [attr.width]="size"
  [attr.height]="size"
  [attr.stroke-width]="strokeWidth"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
  focusable="false"
>

    @case ('alert-circle') {
      <circle cx="12" cy="12" r="9" />
      <path d="M12 8v4.5" />
      <path d="M12 16h.01" />
    }
    @case ('alert-triangle') {

      <path d="M12 17h.01" />

    @case ('calendar') {
      <path d="M5 4.5h14a2 2 0 0 1 2 2V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6.5a2 2 0 0 1 2-2Z" />

      <path d="m14.5 18-6-6 6-6" />
    }
    @case ('chevron-right') {
      <path d="m9.5 6 6 6-6 6" />

    @case ('coins') {
      <circle cx="9" cy="9" r="6" />
      <path d="M17.9 10.4A6 6 0 1 1 10.3 18" />
      <path d="M8 7h1v4" />

    @case ('eye') {
      <path d="M1.8 12S5.5 5 12 5s10.2 7 10.2 7-3.7 7-10.2 7S1.8 12 1.8 12Z" />
      <circle cx="12" cy="12" r="3" />

    @case ('eye-off') {
      <path d="M9.9 5.2A9.6 9.6 0 0 1 12 5c6.5 0 10.2 7 10.2 7a17.5 17.5 0 0 1-2.8 3.7M6.2 6.7A17.4 17.4 0 0 0 1.8 12S5.5 19 12 19a9.5 9.5 0 0 0 4-.9" />

      <path d="M21 4H3l7.2 8.5V19l3.6 2v-8.5L21 4Z" />
    }
    @case ('inbox') {
      <path d="M22 12h-5.5l-1.5 2.5h-6L7.5 12H2" />
      <path d="M5.6 4.9 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.6-7.1A2 2 0 0 0 16.6 4H7.4a2 2 0 0 0-1.8.9Z" />
    }
    @case ('log-out') {
      <path d="M9.5 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4.5" />
      <path d="m16 16.5 4.5-4.5L16 7.5" />
      <path d="M20.5 12H9" />
    }
    @case ('menu') {
      <path d="M3.5 7h17" />
      <path d="M3.5 12h17" />
      <path d="M3.5 17h17" />
    }
    @case ('pencil') {
      <path d="M4 20h4L19.4 8.6a2.1 2.1 0 0 0-3-3L5 17v3Z" />
      <path d="m14.5 6.5 3 3" />

    @case ('pie-chart') {
      <path d="M20.9 15.6A9.5 9.5 0 1 1 8.4 3.1" />
      <path d="M21.5 11.5A9.5 9.5 0 0 0 12 2v9.5Z" />

    @case ('plus') {
      <path d="M12 5.5v13" />

    @case ('receipt') {
      <path d="M6 2.5h12a1 1 0 0 1 1 1v18l-3.25-2-2.5 1.6-2.5-1.6-2.5 1.6L6 20.4V3.5a1 1 0 0 1 1-1Z" />
      <path d="M9 8h6" />
      <path d="M9 12h6" />
    }
    @case ('tag') {
      <path d="M20.6 12.2 12.4 20.4a2 2 0 0 1-2.8 0l-7-7A2 2 0 0 1 2 12V4.5a2 2 0 0 1 2-2h7.5a2 2 0 0 1 1.4.6l7.7 7.7a2 2 0 0 1 0 2.8Z" />

      <path d="M8.5 6V4.5a1.5 1.5 0 0 1 1.5-1.5h4a1.5 1.5 0 0 1 1.5 1.5V6" />

      <path d="M13.5 10.5v6" />
    }
    @case ('trending-down') {
      <path d="M21 17.5 13.5 10l-4 4L3 7.5" />
      <path d="M15.5 17.5H21V12" />

    @case ('trending-up') {
      <path d="M21 6.5 13.5 14l-4-4L3 16.5" />
      <path d="M15.5 6.5H21V12" />

    @case ('wallet') {
      <path d="M3 6.5A2.5 2.5 0 0 1 5.5 4H17a1 1 0 0 1 1 1v2" />
      <path d="M3 6.5V18a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-8a2 2 0 0 0-2-2H5.5A2.5 2.5 0 0 1 3 6.5Z" />
      <circle cx="17" cy="14" r="1.05" />
    }
    @case ('x') {
      <path d="M18 6 6 18" />
      <path d="m6 6 12 12" />
    }
  }
