<div class="page">
  <section class="app">
    <nav class="nav" [class.nav--open]="menuOpen()">
      <p class="nav__brand">Expense tracker</p>

      @for (link of links; track link.path) {
        <a
          class="nav__item"
          routerLinkActive="nav__item--active"
          [routerLink]="link.path"
          (click)="closeMenu()"
          >{{ link.label }}</a
        >
      }

      <div class="nav__user">
        <div class="nav__avatar">{{ initials() }}</div>
        <span class="nav__name">{{ user()?.username }}</span>
      </div>

      <button class="nav__signout" type="button" (click)="signOut()">Sign out</button>
    </nav>

    <div class="main">
      <button class="menu-toggle btn" type="button" (click)="toggleMenu()">
        {{ menuOpen() ? 'Close menu' : 'Menu' }}
      </button>

      <router-outlet />
    </div>
  </section>
</div>
