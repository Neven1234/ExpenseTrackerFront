<div class="page">
  <section class="app">
    <nav class="nav" [class.nav--open]="menuOpen()">
      <p class="nav__brand"><app-icon name="coins" [size]="18" />Expense tracker</p>

      @for (link of links; track link.path) {
        <a
          class="nav__item"
          routerLinkActive="nav__item--active"
          [routerLink]="link.path"
          (click)="closeMenu()"
        >
          <app-icon [name]="link.icon" />{{ link.label }}
        </a>
      }

      <div class="nav__user">
        <div class="nav__avatar">{{ initials() }}</div>
        <span class="nav__name">{{ user()?.username }}</span>
      </div>

      <button class="nav__signout" type="button" (click)="signOut()">
        <app-icon name="log-out" [size]="14" />Sign out
      </button>
    </nav>

    <div class="main">
      <button class="menu-toggle btn" type="button" (click)="toggleMenu()">
        <app-icon [name]="menuOpen() ? 'x' : 'menu'" />
        {{ menuOpen() ? 'Close menu' : 'Menu' }}
      </button>

      <router-outlet />
    </div>
  </section>
</div>
